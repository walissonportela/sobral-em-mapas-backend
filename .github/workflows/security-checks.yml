name: Backend security checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/security]

permissions:
  contents: read

jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Validate PHP syntax
        run: find app config routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
